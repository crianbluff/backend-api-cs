services:
  cs_api:
    image: cs_api_prod:latest
    container_name: cs_api_container_prod

    build:
      context: .
      dockerfile: Dockerfile
      target: production

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./credentials:/app/credentials:ro

    networks:
      - cs_network_prod

networks:
  cs_network_prod:
    external: true
    name: cs_network_prod
