services:
  cs_api:
    image: cs_api_dev:latest

    build:
      context: .
      dockerfile: Dockerfile.dev

    ports:
      - '3001:3001'

    env_file:
      - .env.dev

    volumes:
      # Mount source for hot-reload — node_modules stays in the container
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json:ro
      - /app/node_modules

      # Google Cloud credentials — read only
      - ./credentials:/app/credentials:ro

    depends_on:
      mongo:
        condition: service_healthy

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - cs_network_dev

  mongo:
    image: mongo:7.0-jammy
    # container_name: cs_mongo_dev

    volumes:
      - cs_mongo_data_dev:/data/db

    environment:
      MONGO_INITDB_DATABASE: cs_db

    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - cs_network_dev

  # MongoDB visual UI — only in dev
  mongo-express:
    image: mongo-express:1.0.2

    ports:
      - '127.0.0.1:8081:8081'

    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
      ME_CONFIG_MONGODB_ENABLE_ADMIN: 'true'

    depends_on:
      mongo:
        condition: service_healthy

    networks:
      - cs_network_dev

volumes:
  cs_mongo_data_dev:
    name: cs_mongo_data_dev

networks:
  cs_network_dev:
    external: true
    name: cs_network_dev
